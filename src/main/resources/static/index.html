<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Engine</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr);
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .section {
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .sidebar {
            position: sticky;
            top: 40px;
        }

        h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }

        .stepper {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .stepper button {
            width: 28px;
            height: 28px;
            padding: 0;
            margin: 0;
            font-size: 16px;
            line-height: 1;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fafafa;
        }

        .stepper button:hover {
            background: #eee;
        }

        .stepper input {
            width: 44px;
            padding: 5px;
            text-align: center;
            font-size: 14px;
            -moz-appearance: textfield;
        }

        .stepper input::-webkit-inner-spin-button,
        .stepper input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 4px;
        }

        .result h3 {
            margin-top: 0;
        }

        .error {
            background: #fee;
            color: #c00;
        }

        .promotions {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        .promotions div + div {
            margin-top: 10px;
        }
    </style>
</head>
<body>
<h1>Pricing Engine</h1>
<div class="layout">
    <div>
        <div class="section">
            <h2>Shopping Cart</h2>
            <table>
                <thead>
                <tr>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Qty</th>
                </tr>
                </thead>
                <tbody id="products"></tbody>
            </table>
            <p><strong>Subtotal:</strong> $<span id="subtotal">0.00</span></p>
        </div>
        <div class="section">
            <h2>Calculate</h2>
            <button onclick="calculateTotal()">Calculate Total</button>
            <div id="result" class="result" style="display:none;"></div>
        </div>
    </div>
    <div class="section sidebar">
        <h2>Active Promotions (Today)</h2>
        <div id="promotions" class="promotions">Loading...</div>
    </div>
</div>
<script>
    const products = [
        {sku: "SKU-LAPTOP-001", name: "Laptop", category: "ELECTRONICS", price: 999.99},
        {sku: "SKU-HEADPHONES-001", name: "Headphones", category: "ELECTRONICS", price: 149.99},
        {sku: "SKU-PHONE-001", name: "Phone", category: "ELECTRONICS", price: 699.99},
        {sku: "SKU-SHIRT-001", name: "T-Shirt", category: "CLOTHING", price: 29.99},
        {sku: "SKU-JEANS-001", name: "Jeans", category: "CLOTHING", price: 59.99},
        {sku: "SKU-SOCKS-001", name: "Socks", category: "CLOTHING", price: 12.99},
        {sku: "SKU-SNEAKERS-001", name: "Sneakers", category: "SHOES", price: 89.99},
        {sku: "SKU-BOOK-001", name: "Programming Book", category: "BOOKS", price: 49.99}
    ];
    const quantities = {};
    const $ = id => document.getElementById(id);
    const renderProducts = () => $('products').innerHTML = products.map(p => `
                <tr>
                    <td>${p.name}</td>
                    <td>${p.category}</td>
                    <td>$${p.price.toFixed(2)}</td>
                    <td>
                        <span class="stepper">
                            <button type="button" onclick="step('${p.sku}', -1)" aria-label="Decrease ${p.name} quantity">&minus;</button>
                            <input id="qty-${p.sku}" type="number" min="0" value="0" aria-label="${p.name} quantity" onchange="setQty('${p.sku}', this.value)">
                            <button type="button" onclick="step('${p.sku}', 1)" aria-label="Increase ${p.name} quantity">+</button>
                        </span>
                    </td>
                </tr>
            `).join('');
    const setQty = (sku, qty) => {
        quantities[sku] = Math.max(0, parseInt(qty) || 0);
        $(`qty-${sku}`).value = quantities[sku];
        updateSubtotal();
    };
    const step = (sku, delta) => setQty(sku, (quantities[sku] || 0) + delta);
    const getCart = () => products.filter(p => quantities[p.sku] > 0).map(p => ({...p, quantity: quantities[p.sku]}));
    const subtotal = () => products.reduce((sum, p) => sum + p.price * (quantities[p.sku] || 0), 0);
    const updateSubtotal = () => $('subtotal').textContent = subtotal().toFixed(2);
    const show = (html, isError = false) => {
        const result = $('result');
        result.innerHTML = html;
        result.className = isError ? 'result error' : 'result';
        result.style.display = 'block';
    };
    const calculateTotal = async () => {
        const cart = getCart();
        if (cart.length === 0) return show('<p>Add items to cart first.</p>', true);
        try {
            const res = await fetch('/api/pricing/calculate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(cart)
            });
            const {total} = await res.json();
            total !== undefined ? show(`<h3>Total: $${total.toFixed(2)}</h3>`) : show('<p>Not implemented yet</p>', true);
        } catch (e) {
            show(`<p>Error: ${e.message}</p>`, true);
        }
    };
    const loadPromotions = async () => {
        try {
            const promos = await (await fetch('/api/promotions')).json();
            $('promotions').innerHTML = promos.map(p =>
                `<div><strong>${p.id}</strong>: ${p.description} ${p.stackable ? '(stackable)' : '(non-stackable)'}</div>`
            ).join('');
        } catch (e) {
            $('promotions').innerHTML = 'Error loading promotions';
        }
    };
    renderProducts();
    loadPromotions();
</script>
</body>
</html>
